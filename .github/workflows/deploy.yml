# --- 3. Build Web (JS) ---
- name: Build Kotlin/JS Web
  run: ./gradlew :composeApp:jsBrowserDistribution

- name: Prepare GitHub Pages
  run: |
    touch composeApp/build/dist/js/productionExecutable/.nojekyll
    ls -R composeApp/build/dist/js/productionExecutable/   # optional

# --- 4. Deploy Web to GitHub Pages ---
- name: Deploy to GitHub Pages
  if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
  uses: JamesIves/github-pages-deploy-action@v4
  with:
    folder: composeApp/build/dist/js/productionExecutable
    branch: gh-pages