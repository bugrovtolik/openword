<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OpenWord</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="manifest" href="manifest.json">
    <link id="ios-pwa-icon" rel="apple-touch-icon" href="icons/icon-light-512.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OpenWord">
    <script defer src="composeApp.js"></script>
    <script defer src="sql-wasm.js"></script>
    <style>
        html { overscroll-behavior: none; background-color: #121212; }
        body {
            width: 100vw; height: 100dvh; margin: 0;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            overflow: hidden; background-color: #121212; box-sizing: border-box;
        }
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background-color: #121212; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 0.4s ease-out;
        }
        .loading-title {
            font-family: system-ui, -apple-system, sans-serif;
            color: #ffffff; font-size: 2.5rem; font-weight: 700;
            margin-bottom: 24px; letter-spacing: -0.02em;
        }
        .spinner {
            width: 48px; height: 48px; border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #bb86fc; border-radius: 50%;
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div id="loading-screen">
    <div class="loading-title">OpenWord</div>
    <div class="spinner"></div>
</div>
<div id="compose-root"></div>

<script>
    (function() {
        if (!('serviceWorker' in navigator)) return;

        let registration;

        function askForUpdate() {
            if (confirm('Доступне оновлення?')) {
                if (registration && registration.waiting) {
                    registration.waiting.postMessage({ action: 'skipWaiting' });
                    setTimeout(() => window.location.reload(), 300);
                }
            }
        }

        navigator.serviceWorker.register('sw.js')
            .then(reg => {
                registration = reg;
                if (reg.waiting) askForUpdate();
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    if (newWorker) {
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                askForUpdate();
                            }
                        });
                    }
                });
            })
            .catch(err => console.error('SW registration failed:', err));
    })();
</script>
</body>
</html>
