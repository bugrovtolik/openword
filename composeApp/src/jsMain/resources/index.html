<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OpenWord</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="manifest" href="manifest.json">
    <link id="ios-pwa-icon" rel="apple-touch-icon" href="icons/icon-light-512.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OpenWord">
    <script src="composeApp.js"></script>
    <script src="sql-wasm.js"></script>
    <style>
        html { overscroll-behavior: none; background-color: #121212; }
        body {
            width: 100vw; height: 100dvh; margin: 0;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            overflow: hidden; background-color: #121212; box-sizing: border-box;
        }
    </style>
</head>
<body>
<div id="compose-root"></div>

<script>
    (function() {
        if (!('serviceWorker' in navigator)) return;

        let registration;

        function askForUpdate() {
            if (confirm('Доступне оновлення?')) {
                if (registration && registration.waiting) {
                    registration.waiting.postMessage({ action: 'skipWaiting' });
                    setTimeout(() => window.location.reload(), 300);
                }
            }
        }

        navigator.serviceWorker.register('sw.js')
            .then(reg => {
                registration = reg;
                if (reg.waiting) askForUpdate();
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    if (newWorker) {
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                askForUpdate();
                            }
                        });
                    }
                });
            })
            .catch(err => console.error('SW registration failed:', err));
    })();
</script>
</body>
</html>
